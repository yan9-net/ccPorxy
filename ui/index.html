<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ccNexus - API 代理管理</title>
    <link rel="icon" href="./img/favicon.ico" type="image/x-icon">

    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.4.4/dist/index.css">
    <!-- Element Plus Dark Theme -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.4.4/theme-chalk/dark/css-vars.css" id="dark-theme-link" disabled>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="./css/app.css">
</head>
<body>
    <div id="app">
        <el-config-provider :locale="zhCn">
            <div class="app-container" :class="{ 'dark': isDark }">
                <!-- Sidebar -->
                <aside class="sidebar">
                    <div class="sidebar-header">
                        <h1 class="logo">ccNexus</h1>
                        <p class="subtitle">AI 代理网关</p>
                    </div>

                    <el-menu
                        :default-active="currentRoute"
                        class="sidebar-menu"
                        @select="handleMenuSelect"
                    >
                        <el-menu-item index="dashboard">
                            <el-icon><Monitor /></el-icon>
                            <span>仪表盘</span>
                        </el-menu-item>
                        <el-menu-item index="endpoints">
                            <el-icon><Link /></el-icon>
                            <span>节点管理</span>
                        </el-menu-item>
                        <el-menu-item index="stats">
                            <el-icon><DataLine /></el-icon>
                            <span>统计数据</span>
                        </el-menu-item>
                        <el-menu-item index="testing">
                            <el-icon><Cpu /></el-icon>
                            <span>测试工具</span>
                        </el-menu-item>
                    </el-menu>

                    <div class="sidebar-footer">
                        <el-tooltip :content="isDark ? '切换到亮色模式' : '切换到暗色模式'" placement="right">
                            <el-button circle @click="toggleTheme">
                                <el-icon v-if="isDark"><Sunny /></el-icon>
                                <el-icon v-else><Moon /></el-icon>
                            </el-button>
                        </el-tooltip>
                    </div>
                </aside>

                <!-- Main Content -->
                <main class="main-content">
                    <component :is="currentView"></component>
                </main>
            </div>
        </el-config-provider>
    </div>

    <!-- Vue 3 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.15/dist/vue.global.prod.js"></script>
    <!-- Element Plus -->
    <script src="https://cdn.jsdelivr.net/npm/element-plus@2.4.4/dist/index.full.min.js"></script>
    <!-- Element Plus Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
    <!-- Element Plus Chinese locale -->
    <script src="https://cdn.jsdelivr.net/npm/element-plus@2.4.4/dist/locale/zh-cn.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Application -->
    <script src="./js/api.js"></script>
    <script src="./js/components/dashboard.js"></script>
    <script src="./js/components/endpoints.js"></script>
    <script src="./js/components/stats.js"></script>
    <script src="./js/components/testing.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
